<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rotas de Distribuição de Urnas | 2ª RPM</title><style>*{box-sizing:border-box}
:root{--black:#050505;--black2:#0b0b0a;--navy:#0b1d2a;--navy2:#122b3d;--gold:#c49a3a;--gold2:#e1bd61;--cream:#f4f0e6;--text:#18222b;--muted:#66717a;--line:#d8d0bd}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#eeeae1 0,#f7f5ef 45%,#ece8df 100%);color:var(--text)}
.top{background:linear-gradient(135deg,var(--black) 0%,#0a1116 48%,var(--navy) 100%);color:#fff;padding:0 16px;position:sticky;top:0;z-index:10;box-shadow:0 5px 18px #0007;border-bottom:3px solid var(--gold)}
.top:before{content:"";display:block;height:4px;max-width:1100px;margin:auto;background:linear-gradient(90deg,transparent 0,var(--gold) 12%,var(--gold2) 50%,var(--gold) 88%,transparent 100%)}
.brand{max-width:1100px;margin:auto;padding:13px 0 15px;position:relative;display:flex;align-items:center;gap:16px}
.brand:after{content:"";position:absolute;right:0;top:50%;width:115px;height:4px;background:var(--gold);box-shadow:-28px 10px 0 -1px #fff8}.shield{width:78px;height:88px;object-fit:contain;flex:none;filter:drop-shadow(0 3px 5px #0008)}.brandtext{min-width:0}.subtitle{margin-top:7px;color:#d8cba9;font-size:10px;letter-spacing:1.7px;font-weight:700}
.brand small{display:block;color:#ddd6c7;letter-spacing:1.3px;font-weight:600;font-size:11px;text-transform:uppercase}
.brand h1{margin:6px 0 0;font-size:27px;line-height:1.1;letter-spacing:.2px;color:#fff}
.brand h1:after{content:"";display:block;width:92px;height:3px;margin-top:10px;background:var(--gold2)}
.wrap{max-width:1100px;margin:20px auto;padding:0 14px}
.filters{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:12px;margin-bottom:15px}
.filterbox{display:flex;flex-direction:column;gap:6px}
.filterbox label{font-size:11px;font-weight:800;color:#4b4030;letter-spacing:1px}
.filters select,.filters input{width:100%;height:50px;padding:12px 14px;border:1px solid #c8c0b0;border-radius:8px;background:#fffdf8;color:#18222b;font-size:15px;font-weight:600;outline:none;box-shadow:0 2px 5px #0000000b}
.filters select:focus,.filters input:focus{border-color:var(--gold);box-shadow:0 0 0 3px #c49a3a26}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}
.stat{background:linear-gradient(135deg,#101010,#172630);color:#fff;border:1px solid #8c6d2c;border-radius:9px;padding:9px 15px;min-width:105px;box-shadow:0 3px 9px #0002}
.stat b{font-size:19px;color:var(--gold2)}
.stat small{color:#ddd8cd;letter-spacing:.5px}
.route{background:#fffdf9;border:1px solid #d4cbb9;border-radius:10px;margin:12px 0;overflow:hidden;box-shadow:0 3px 10px #0000000b}
.routehead{padding:12px 15px;background:linear-gradient(90deg,#101010 0%,#142633 72%,#1a3547 100%);color:#fff;display:flex;justify-content:space-between;gap:12px;align-items:center;border-left:5px solid var(--gold)}
.routehead strong{font-size:15px;letter-spacing:.2px}.routehead span{font-size:12px;color:#ead7a2;font-weight:700}
.places{padding:3px 15px 8px}.place{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #eee8dc}.place:last-child{border-bottom:0}
.place-name{font-size:14px;line-height:1.35;color:#202a31;font-weight:500}
.open{flex:none;text-decoration:none;background:linear-gradient(135deg,#a97e25,#d0a746);color:#080808;padding:9px 13px;border-radius:7px;font-size:12px;font-weight:900;letter-spacing:.4px;border:1px solid #8e681e;box-shadow:0 2px 5px #0002}.open:hover{background:linear-gradient(135deg,#c29436,#e0bd61)}
.empty{text-align:center;padding:35px;background:#fffdf9;border-radius:12px;color:#68737d;border:1px solid #d4cbb9}
@media(max-width:700px){.filters{grid-template-columns:1fr}.top{padding:0 12px}.brand{padding:12px 0 14px;gap:11px}.shield{width:55px;height:64px}.brand:after{display:none}.brand h1{font-size:21px}.brand small{font-size:9px}.subtitle{font-size:8px;letter-spacing:1.1px;margin-top:5px}.wrap{padding:0 10px;margin-top:15px}.routehead{align-items:flex-start;flex-direction:column;gap:5px}.place{align-items:flex-start;flex-direction:column}.open{width:100%;text-align:center}.stats{margin-bottom:12px}.stat{flex:1;min-width:90px}}
