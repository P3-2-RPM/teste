<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Efetivo Eleitoral — 2ª RPM</title>
<style>
:root{--bg:#090c0f;--panel:#14191f;--panel2:#1b2229;--gold:#c9a34a;--gold2:#e3c66c;--text:#f2f3f5;--muted:#aeb6bf;--line:#2b333c;--green:#78d39a}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#080a0d,#10151a);color:var(--text);font-family:Arial,Helvetica,sans-serif}
header{padding:20px 18px 15px;border-bottom:1px solid var(--line);background:#0c1014;position:sticky;top:0;z-index:20}
.brand{max-width:1250px;margin:auto}.eyebrow{color:var(--gold2);font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase}
.title{font-size:27px;font-weight:800;margin:5px 0}.sub{color:var(--muted);font-size:13px}
main{max-width:1250px;margin:auto;padding:18px}
.now{background:linear-gradient(135deg,#171d23,#11161b);border:1px solid #675329;border-radius:14px;padding:16px 18px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.now strong{font-size:34px;color:var(--gold2)}.now small{display:block;color:var(--muted);margin-top:3px}.clock{text-align:right;font-size:19px;font-weight:700}.clock span{display:block;color:var(--muted);font-size:11px;font-weight:400;margin-top:3px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:15px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px}.stat b{display:block;font-size:25px;color:var(--gold2)}.stat span{font-size:10px;color:var(--muted);text-transform:uppercase}
.filters{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:9px;margin-bottom:12px}.input,.select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);outline:none}.input:focus,.select:focus{border-color:var(--gold)}
.status{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px;margin:8px 0 10px}.list{display:grid;gap:10px}
.person{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}.person-head{padding:13px 15px;background:var(--panel2);display:flex;justify-content:space-between;gap:12px;align-items:center}
.name{font-size:16px;font-weight:800}.meta{color:var(--muted);font-size:11px;margin-top:4px}.badge{color:var(--green);font-size:10px;font-weight:800;border:1px solid #3a7550;border-radius:999px;padding:5px 8px;white-space:nowrap}
.fields{display:grid;grid-template-columns:repeat(4,1fr)}.field{padding:11px 13px;border-top:1px solid var(--line);border-right:1px solid var(--line);min-width:0}.field:nth-child(4n){border-right:0}
.label{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;font-weight:700;margin-bottom:4px}.value{font-size:12px;line-height:1.4;word-break:break-word}.full{grid-column:1/-1;border-right:0}
.actions{display:flex;gap:8px;padding:11px 13px;border-top:1px solid var(--line);background:#11161b}.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid var(--line);color:var(--text);background:#1a2128;border-radius:9px;padding:9px 12px;font-size:11px;font-weight:700}.btn.gold{border-color:#7f672f;color:#f1d26f}.btn.green{border-color:#3a7550;color:#8be0a7}
.empty{text-align:center;color:var(--muted);padding:35px;background:var(--panel);border:1px solid var(--line);border-radius:13px}
@media(max-width:900px){.filters{grid-template-columns:1fr 1fr}.fields{grid-template-columns:repeat(2,1fr)}.field:nth-child(4n){border-right:1px solid var(--line)}.field:nth-child(2n){border-right:0}.full{grid-column:1/-1}}
@media(max-width:560px){header{position:relative}.title{font-size:22px}.now{align-items:flex-start}.clock{font-size:16px}.stats{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.fields{grid-template-columns:1fr 1fr}.person-head{align-items:flex-start}.badge{font-size:9px}}
</style>
</head>
<body>
<header><div class="brand">
<div class="eyebrow">Polícia Militar de Minas Gerais • 2ª RPM</div>
<div class="title">Efetivo Eleitoral</div>
<div class="sub">Controle do efetivo empregado nas Eleições 2026</div>
</div></header>

<main>
<section class="now">
<div><strong id="emServico">—</strong><small>militares em serviço neste momento</small></div>
<div class="clock"><span id="hora">--:--:--</span><span>hora do dispositivo do usuário</span></div>
</section>

<section class="stats">
<div class="stat"><b id="total">—</b><span>Efetivo cadastrado</span></div>
<div class="stat"><b id="resultado">—</b><span>Registros exibidos</span></div>
</section>

<section class="filters">
<input id="busca" class="input" placeholder="Pesquisar nome, nº PM..." oninput="render()">
<select id="ueop" class="select" onchange="render()"><option value="">Todas as UEOp</option></select>
<select id="faixa" class="select" onchange="render()"><option value="">Todas as faixas de horário</option></select>
<select id="funcao" class="select" onchange="render()"><option value="">Todas as funções</option></select>
</section>

<div class="status"><span id="status">Carregando...</span><span>Atualização automática a cada 60 s</span></div>
<div id="lista" class="list"></div>
</main>

const norm=s=>(s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
function minutos(h){const m=String(h||'').match(/(\d{1,2}):(\d{2})/);return m?Number(m[1])*60+Number(m[2]):null}
function ativo(x,agora){
 const i=minutos(x['Início do Turno']),f=minutos(x['Término do Turno']);
 if(i===null||f===null||i===f)return false;
 if(f>i)return agora>=i&&agora<f;
 return agora>=i||agora<f;
}
function esc(s){return (s||'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function phone(s){return (s||'').toString().replace(/\D/g,'')}
function preencherFiltros(){
 const u=[...new Set(dados.map(x=>x['UEOp']).filter(Boolean))].sort();
 const f=[...new Set(dados.map(x=>`${x['Início do Turno']} – ${x['Término do Turno']}`).filter(x=>!x.includes(' – ')?false:true))].sort((a,b)=>minutos(a)-minutos(b));
 const funSet=new Set();
 dados.forEach(x=>String(x['Função no dia das Eleições']||'').split(/[,;|]/).map(v=>v.trim()).filter(Boolean).forEach(v=>funSet.add(v)));
 const fun=[...funSet].sort();
 document.getElementById('ueop').innerHTML='<option value="">Todas as UEOp</option>'+u.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
 document.getElementById('faixa').innerHTML='<option value="">Todas as faixas de horário</option>'+f.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
 document.getElementById('funcao').innerHTML='<option value="">Todas as funções</option>'+fun.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
}
function faixaDo(x){return `${x['Início do Turno']} – ${x['Término do Turno']}`}
function atualizar(){
 const d=new Date(),h=d.getHours()*60+d.getMinutes();
 document.getElementById('hora').textContent=d.toLocaleTimeString('pt-BR',{hour12:false});
 document.getElementById('emServico').textContent=dados.filter(x=>ativo(x,h)).length;
 render();
}
function render(){
 const q=norm(document.getElementById('busca').value),u=document.getElementById('ueop').value;
 const f=document.getElementById('faixa').value,fun=norm(document.getElementById('funcao').value);
 const d=new Date(),h=d.getHours()*60+d.getMinutes();
 const rows=dados.filter(x=>{
   const texto=[x['Nome'],x['Nº PM (sem ponto e traço)'],x['UEOp'],x['Posto/Grad'],x['Função no dia das Eleições'],x['Celular com Whatsapp (99) 9999-9999'],x['Observações']].some(v=>norm(v).includes(q));
   const func=norm(x['Função no dia das Eleições']).includes(fun);
   return ativo(x,h)&&(!q||texto)&&(!u||x['UEOp']===u)&&(!f||faixaDo(x)===f)&&(!fun||func);
 });
 document.getElementById('resultado').textContent=rows.length;
 document.getElementById('status').textContent=rows.length+' militar(es) em serviço agora';
 document.getElementById('lista').innerHTML=rows.length?rows.map(card).join(''):'<div class="empty">Nenhum militar corresponde aos filtros neste momento.</div>';
}
function card(x){
 const p=phone(x['Celular com Whatsapp (99) 9999-9999']);
 const tel=p?`tel:+55${p}`:'#', wa=p?`https://wa.me/55${p}`:'#';
 const labels=[
 ['UEOp','UEOp'],['Nº PM (sem ponto e traço)','Nº PM'],['Posto/Grad','Posto/Grad'],['Nome','Nome'],
 ['Celular com Whatsapp (99) 9999-9999','Celular / WhatsApp'],
 ['Função no dia das Eleições','Função no dia das Eleições'],['Início do Turno','Início do Turno'],['Término do Turno','Término do Turno'],['Observações','Observações']
 ];
 return `<article class="person"><div class="person-head"><div><div class="name">${esc(x['Nome'])}</div><div class="meta">${esc(x['Posto/Grad'])} • ${esc(x['UEOp'])} • PM ${esc(x['Nº PM (sem ponto e traço)'])}</div></div><div class="badge">EM SERVIÇO</div></div><div class="fields">`+
 labels.map(([k,l])=>`<div class="field ${k==='Observações'?'full':''}"><span class="label">${esc(l)}</span><span class="value">${esc(x[k])||'—'}</span></div>`).join('')+
 `</div>${p?`<div class="actions"><a class="btn green" href="${tel}">Ligar</a><a class="btn gold" href="${wa}" target="_blank" rel="noopener">WhatsApp</a></div>`:''}</article>`;
}
preencherFiltros();
document.getElementById('total').textContent=dados.length;
atualizar();
setInterval(atualizar,60000);
</script>
